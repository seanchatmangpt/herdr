[project]
name = "herdr-autonomic-control-plane"
version = "26.9.2"
description = "Manufacture Herdr autonomic risk admission and Groq model economics"

[ontology]
source = "ontology.ttl"
base_iri = "https://seanchatmangpt.github.io/herdr/ontology/autonomic#"
imports = []

[ontology.prefixes]
ha = "https://seanchatmangpt.github.io/herdr/ontology/autonomic#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"

[generation]
output_dir = ".."

[[generation.rules]]
name = "groq-model-policy"
query = { file = "queries/models.rq" }
template = { file = "templates/models.json.tmpl" }
output_file = "autonomic/models.generated.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "herdr-risk-policy"
query = { file = "queries/risk.rq" }
template = { file = "templates/risk.json.tmpl" }
output_file = "autonomic/risk.generated.json"
skip_empty = false
mode = "Overwrite"
